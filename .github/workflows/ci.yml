name: Guardian Judge App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Zero-dependency acceptance
        run: python scripts/self_test.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Validate JavaScript syntax
        run: node --check app/app.js

      - name: Install developer test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Developer test suite
        run: python -m pytest -q

      - name: Diff hygiene
        run: git diff --check
